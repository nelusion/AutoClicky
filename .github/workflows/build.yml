name: Build AutoClicky

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 25
  uses: actions/setup-java@v4
  with:
    java-version: 25
    distribution: temurin


      - name: Make Gradle executable
        run: chmod +x ./gradlew


      - name: Build with Gradle
        run: ./gradlew build


      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicky-build
          path: build/libs/*.jar
